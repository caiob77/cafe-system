name: CI

# Roda em todo PR para a main e em todo push na main/dev.
# Espelha o checklist "Antes de subir" do docs/deploy.md: se ficar vermelho, não faça deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

# Um push novo na mesma branch cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem do campo "packageManager" do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # mesma dos Dockerfiles (node:22-alpine)
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Igual ao Dockerfile da API: o client do Prisma não é versionado.
      - name: Gerar Prisma Client
        run: pnpm --filter @cafe/db exec prisma generate

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
